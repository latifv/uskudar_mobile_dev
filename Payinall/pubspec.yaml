name: payinall
description: "Payinall Uygulaması"
publish_to: "none"

#! Uygulama adı , api gibi bilgiler assets/env içerisinde bulunmaktadır.

#! ENV dosyasında APP_VERSION'da değiştirin hepsinden.
version: 2.4.2+79

environment:
  sdk: ^3.8.1

dependencies:
  auto_route: ^11.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.3.0
  dio: ^5.9.0
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  firebase_analytics: ^12.0.4
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4
  flag: ^7.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_contacts: ^1.1.9+2
  flutter_dotenv: ^6.0.0
  flutter_html: ^3.0.0
  flutter_local_notifications: ^19.5.0
  flutter_map: ^8.2.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_styled_toast: ^2.3.0
  flutter_svg: ^2.2.3
  flutter_switch: ^0.3.2
  font_awesome_flutter: ^11.0.0
  fpdart: ^1.2.0
  get_it: ^9.2.0
  google_fonts: ^6.3.3
  geolocator: ^14.0.2
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  image_picker: ^1.2.1
  intl: ^0.20.2
  intl_phone_field_v2: ^4.0.5
  jailbreak_root_detection: ^1.2.0+1
  json_annotation: ^4.9.0
  loading_indicator: ^3.1.1
  lottie: ^3.3.2
  latlong2: ^0.9.1
  mask_text_input_formatter: ^2.9.0
  mobile_device_identifier: ^0.0.3
  mobile_scanner: ^7.1.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.1
  pretty_dio_logger: ^1.4.0
  qr_flutter: ^4.1.0
  signalr_netcore: ^1.4.4
  smooth_page_indicator: ^1.2.1
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.2

# Kullanıktan sonra flutter_native_splash'i yorum satırına alın veya kullanacaksanız açın.
# Kullanıktan sonra flutter_launcher_icons'i yorum satırına alın veya kullanacaksanız açın.
# Aşşağıda bir tane daha var onlarıda yorum satırına alın veya kullanacaksanız açın.
#! Logo : 512x512 (Transparan PNG) (ic_logo.png)
#! iOS Logo : 1024x1024 (Arkası Beyaz PNG) (ic_ios_logo.png)
#! Splash Logo : 1152x1152 (Transparan PNG) (ic_splash.png) (Logo Ortada Circle İçinde 768x768 Alan İçinde Olmalı)

dev_dependencies:
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.4
  flutter_test:
    sdk: flutter
  # flutter_launcher_icons: ^0.14.4
  # flutter_native_splash: ^2.4.6
  hive_ce_generator: ^1.10.1
  json_serializable: ^6.11.3
  very_good_analysis: ^10.0.0

dependency_overrides:
  connectivity_plus:
    path: vendor_plugins/connectivity_plus
  device_info_plus:
    path: vendor_plugins/device_info_plus

# Kullanıktan sonra flutter_native_splash'i yorum satırına alın veya kullanacaksanız açın.
# Üstteki yeride yorum satırına alın veya kullanacaksanız açın.

# flutter_native_splash:
#   color: "#F7F7F7"
#   image: assets/icons/ic_native_splash.png
#   android_12:
#     image: assets/icons/ic_native_splash.png
#     icon_background_color: "#F7F7F7"
#   web: false
#   ios: true

# Kullanıktan sonra flutter_launcher_icons'i yorum satırına alın veya kullanacaksanız açın.
# Üstteki yeride yorum satırına alın veya kullanacaksanız açın.
#! IOS logo olarak kalsın oynamayın lütfen!
# flutter_launcher_icons:
#   android: true
#   ios: true
#   image_path: "assets/icons/ic_native_ios_logo.png"
#   min_sdk_android: 23
#   adaptive_icon_background: "#FFFFFF"
#   adaptive_icon_foreground: "assets/icons/ic_native_ios_logo.png"
#   adaptive_icon_foreground_inset: 25
#   adaptive_icon_monochrome: "assets/icons/ic_native_ios_logo.png"
#   image_path_android: "assets/icons/ic_native_ios_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/paycore_cards/
    - assets/icons/
    - assets/translations/
    - assets/env/
